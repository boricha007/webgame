<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEON BULLET BOSS</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070912;color:#eaf7ff;font-family:monospace;display:grid;place-items:center;min-height:100vh}
#wrap{width:min(94vw,560px);padding:16px}.hud{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px;font-size:13px;flex-wrap:wrap}
.bossbar{height:12px;background:#21121a;border:1px solid #603044;border-radius:8px;overflow:hidden;margin-bottom:8px}.bossbar i{display:block;height:100%;width:100%;background:#ff4f7b}
.stage{position:relative;aspect-ratio:3/4;background:#05070d;border:1px solid #263040;overflow:hidden}canvas{display:block;width:100%;height:100%}
.buttons{display:flex;gap:8px;justify-content:center;margin-top:10px}.buttons button{background:#111827;color:#eaf7ff;border:1px solid #334155;border-radius:8px;padding:10px 16px;font:inherit;cursor:pointer}
.hint{text-align:center;color:#91a4b4;font-size:11px;margin-top:8px}
</style>
</head>
<body>
<div id="wrap">
<div class="hud"><span>SCORE <b id="score">0</b></span><span>HP <b id="php">3</b></span><span>BOSS <b id="bp">100%</b></span></div>
<div class="bossbar"><i id="bossfill"></i></div>
<div class="stage"><canvas id="game"></canvas></div>
<div class="buttons"><button id="start">START</button><button id="pause">PAUSE</button><button id="restart">RESTART</button></div>
<div class="hint">WASD / 방향키 이동 · Shift 정밀 이동 · Z / Space 연사 · 마우스/터치 이동</div>
</div>
<script>
(()=>{const c=document.querySelector("#game"),x=c.getContext("2d"),scoreE=document.querySelector("#score"),hpE=document.querySelector("#php"),bpE=document.querySelector("#bp"),fill=document.querySelector("#bossfill");
let W,H,dpr,last=0,raf,running=false,paused=false,win=false,score=0,time=0,spawn=0,fire=0,phase=0,keys={};let eb=[],pb=[],fx=[];
const p={x:.5,y:.86,r:5,hp:3,inv:0},b={x:.5,y:.14,w:.16,h:.065,hp:100,vx:.2};
function size(){let r=c.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}new ResizeObserver(size).observe(c);size();
function hud(){scoreE.textContent=Math.floor(score);hpE.textContent=p.hp;let q=Math.max(0,b.hp);bpE.textContent=Math.ceil(q)+"%";fill.style.width=q+"%"}
function reset(){running=false;paused=false;win=false;score=time=phase=spawn=fire=0;eb=[];pb=[];fx=[];Object.assign(p,{x:.5,y:.86,r:5,hp:3,inv:0});Object.assign(b,{x:.5,y:.14,w:.16,h:.065,hp:100,vx:.2});hud()}
function bullet(x0,y0,a,s,r=4){eb.push({x:x0,y:y0,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r,g:false,life:10})}
function burst(){let n=22,o=phase*.55;for(let i=0;i<n;i++)bullet(b.x,b.y+.04,o+i*Math.PI*2/n,.13,4);for(let i=0;i<5;i++)bullet(b.x,b.y+.04,Math.PI/2+(i-2)*.18,.18,3)}
function spiral(){for(let i=0;i<7;i++)bullet(b.x,b.y+.04,phase*1.8+i*.38,.16,3.5)}
function boom(X,Y,n=12){for(let i=0;i<n;i++){let a=Math.random()*6.283,s=.03+Math.random()*.13;fx.push({x:X,y:Y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.4+Math.random()*.6,r:1+Math.random()*3})}}
function hurt(){if(p.inv>0)return;p.hp--;p.inv=1.1;score=Math.max(0,score-150);boom(p.x,p.y,18);if(p.hp<=0)running=false}
function hitBoss(){b.hp=Math.max(0,b.hp-1.7);score+=25;boom(b.x,b.y,3);if(b.hp<=0){win=true;running=false;for(let i=0;i<100;i++)boom(b.x,b.y,1)}}
function update(dt){if(!running||paused)return;time+=dt;phase+=dt;score+=dt*3;p.inv=Math.max(0,p.inv-dt);
let focus=keys.Shift||keys.ShiftLeft||keys.ShiftRight,sp=(focus?.21:.43)*dt,dx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),dy=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0),len=Math.hypot(dx,dy)||1;
p.x=Math.max(.04,Math.min(.96,p.x+dx/len*sp));p.y=Math.max(.45,Math.min(.96,p.y+dy/len*sp));
b.x+=b.vx*dt;if(b.x<.13){b.x=.13;b.vx=Math.abs(b.vx)}if(b.x>.87){b.x=.87;b.vx=-Math.abs(b.vx)}b.y=.14+Math.sin(time*1.7)*.035;
fire-=dt;if((keys.z||keys.Z||keys[" "])&&fire<=0){pb.push({x:p.x,y:p.y-.03,vy:-.9,r:3});fire=.105}
spawn-=dt;if(spawn<=0){burst();if(Math.floor(time)%5>=2)spiral();spawn=Math.max(.48,.9-time*.004)}
for(let i=pb.length-1;i>=0;i--){let q=pb[i];q.y+=q.vy*dt;let dx=(q.x-b.x)*W,dy=(q.y-b.y)*H;if(Math.abs(dx)<b.w*W*.55&&Math.abs(dy)<b.h*H*.8){hitBoss();pb.splice(i,1);continue}if(q.y<-.05)pb.splice(i,1)}
for(let i=eb.length-1;i>=0;i--){let q=eb[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;let dx=(q.x-p.x)*W,dy=(q.y-p.y)*H,d=Math.hypot(dx,dy);if(d<q.r+p.r){hurt();eb.splice(i,1);continue}if(!q.g&&d<q.r+p.r+12){q.g=true;score+=12}if(q.life<=0||q.x<-.2||q.x>1.2||q.y<-.2||q.y>1.2)eb.splice(i,1)}
for(let i=fx.length-1;i>=0;i--){let q=fx[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;if(q.life<=0)fx.splice(i,1)}hud()}
function draw(){x.clearRect(0,0,W,H);x.fillStyle="#05070d";x.fillRect(0,0,W,H);x.strokeStyle="rgba(130,170,210,.05)";for(let i=0;i<W;i+=32){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke()}for(let i=0;i<H;i+=32){x.beginPath();x.moveTo(0,i);x.lineTo(W,i);x.stroke()}
for(const q of eb){x.beginPath();x.arc(q.x*W,q.y*H,q.r,0,7);x.fillStyle="#ff5278";x.fill()}for(const q of pb){x.fillStyle="#8ee8ff";x.fillRect(q.x*W-2,q.y*H-9,4,12)}for(const q of fx){x.globalAlpha=Math.max(0,q.life);x.beginPath();x.arc(q.x*W,q.y*H,q.r,0,7);x.fillStyle="#fff";x.fill();x.globalAlpha=1}
x.save();x.translate(b.x*W,b.y*H);x.fillStyle="#a63b63";x.fillRect(-b.w*W/2,-b.h*H/2,b.w*W,b.h*H);x.strokeStyle="#ff86a8";x.lineWidth=2;x.strokeRect(-b.w*W/2,-b.h*H/2,b.w*W,b.h*H);x.fillStyle="#fff";x.textAlign="center";x.font="bold 12px monospace";x.fillText("BOSS",0,4);x.restore();
if(p.inv<=0||Math.floor(p.inv*12)%2===0){let X=p.x*W,Y=p.y*H;x.beginPath();x.arc(X,Y,p.r+7,0,7);x.strokeStyle="rgba(100,220,255,.35)";x.stroke();x.beginPath();x.moveTo(X,Y-9);x.lineTo(X-6,Y+6);x.lineTo(X+6,Y+6);x.closePath();x.fillStyle="#8ee8ff";x.fill()}
if(!running){x.fillStyle="rgba(0,0,0,.58)";x.fillRect(0,0,W,H);x.textAlign="center";x.fillStyle="#fff";x.font="bold 24px monospace";x.fillText(win?"BOSS DEFEATED":time?"GAME OVER":"NEON BULLET",W/2,H*.47);x.font="12px monospace";x.fillStyle="#b8c4ce";x.fillText(win?"RESTART로 다시 도전":"START 또는 RESTART",W/2,H*.53)}else if(paused){x.fillStyle="rgba(0,0,0,.45)";x.fillRect(0,0,W,H);x.fillStyle="#fff";x.textAlign="center";x.font="bold 22px monospace";x.fillText("PAUSED",W/2,H/2)}}
function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();raf=requestAnimationFrame(loop)}
function start(){if(!running&&!win)running=true}document.querySelector("#start").onclick=start;document.querySelector("#pause").onclick=()=>{if(running)paused=!paused};document.querySelector("#restart").onclick=()=>{reset();running=true};
window.addEventListener("keydown",e=>{keys[e.key]=true;if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," ","Shift"].includes(e.key))e.preventDefault()});window.addEventListener("keyup",e=>keys[e.key]=false);
c.addEventListener("pointermove",e=>{if(e.buttons||e.pointerType==="touch"){let r=c.getBoundingClientRect();p.x=Math.max(.04,Math.min(.96,(e.clientX-r.left)/r.width));p.y=Math.max(.45,Math.min(.96,(e.clientY-r.top)/r.height))}});
c.addEventListener("pointerdown",()=>{if(!running&&!win)start();keys.z=true});c.addEventListener("pointerup",()=>keys.z=false);reset();raf=requestAnimationFrame(loop)})();
</script>
</body>
</html>
